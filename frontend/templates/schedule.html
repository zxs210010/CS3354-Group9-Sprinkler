<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Settings</title>
<style>
  :root { --ink: #172033; --muted: #4b5568; --line: #d6dde8; --pill: #d3deff; --pill-ink: #1e2a78; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, "Segoe UI", sans-serif; color: var(--ink);
         background: linear-gradient(135deg, #bcd0fd 0%, #cfe3f8 55%, #e0f6ec 100%);
         display: flex; justify-content: center; }
  main { width: 100%; max-width: 32rem; padding: 2rem 1.5rem 3rem; }
  h1 { font-size: 2.6rem; line-height: 1.1; margin: 0 0 1.5rem; font-weight: 800; }

  .msg { background: rgba(255,255,255,.7); color: #1f6b4a; border-radius: 12px; padding: .9rem 1rem;
         text-align: center; margin-bottom: 1.25rem; font-size: .95rem; }
  .msg.err { color: #9b1c1c; }

  .label { display: block; margin: 1.4rem 0 .55rem; font-weight: 600; color: var(--muted); font-size: 1rem; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 16px; }

  .days { display: flex; justify-content: space-between; padding: .5rem; gap: .25rem; }
  .day { flex: 1; border: none; background: transparent; border-radius: 12px; padding: .8rem 0;
         font-size: 1rem; font-weight: 500; color: var(--muted); cursor: pointer; font-family: inherit; }
  .day.active { background: var(--pill); color: var(--pill-ink); font-weight: 600; }
  .day.off:not(.active) { opacity: .45; }

  /* on/off switch for the selected day */
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            margin-top: 1.4rem; padding: .9rem 1.1rem; cursor: pointer; font-weight: 600; color: var(--ink); }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .track { flex: none; width: 3rem; height: 1.7rem; border-radius: 1rem; background: #c3cad6;
           position: relative; transition: background .2s; }
  .track::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.3rem; height: 1.3rem;
                  border-radius: 50%; background: #fff; transition: left .2s; }
  .switch input:checked + .track { background: #2f9e6b; }
  .switch input:checked + .track::after { left: 1.5rem; }
  .switch input:focus-visible + .track { outline: 2px solid var(--pill-ink); outline-offset: 2px; }

  #fields.dim { opacity: .45; }

  .time-row { padding: .9rem 1.1rem; }
  .time-row input[type=time] { width: 100%; border: none; outline: none; font-size: 1.15rem;
                               font-family: inherit; color: var(--ink); background: transparent; }
  .hint { margin: .45rem .25rem 0; font-size: .82rem; color: var(--muted); }
  .hint a { color: var(--pill-ink); }

  .stepper { display: flex; align-items: center; padding: .35rem 1.1rem; min-height: 4.4rem; }
  .stepper input { flex: 1; min-width: 0; border: none; outline: none; background: transparent;
                   font-size: 1.3rem; font-family: inherit; color: var(--ink); -moz-appearance: textfield; }
  .stepper input::placeholder { color: #8a93a3; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper button { border: none; background: transparent; font-size: 1.6rem; font-weight: 700;
                    color: var(--muted); width: 2.6rem; height: 2.6rem; cursor: pointer; font-family: inherit; }
  .stepper button:hover { color: var(--ink); }

  .linkbtn { display: block; margin: 1.1rem .25rem 0; padding: 0; border: none; background: none;
             color: var(--pill-ink); font: inherit; font-size: .9rem; cursor: pointer; text-decoration: underline; }

  .save { display: block; width: 100%; margin-top: 1.5rem; padding: 1.1rem; background: #fff;
          border: 1px solid var(--line); border-radius: 16px; font-size: 1.2rem; font-weight: 700;
          color: var(--ink); cursor: pointer; font-family: inherit; }
  .save:hover { background: #f3f7ff; }

  .foot { display: flex; justify-content: space-between; margin-top: 1.25rem; font-size: .9rem; color: var(--muted); }
  .foot a { color: var(--pill-ink); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Daily<br>Settings</h1>

  {% for m in get_flashed_messages() %}
    <div class="msg {{ 'err' if 'Invalid' in m else '' }}">{{ m }}</div>
  {% endfor %}

  <form method="post" id="form">
    <span class="label">Day of the Week</span>
    <div class="box days" id="days"></div>

    <label class="box switch">
      <span>Sprinkler runs on this day</span>
      <input type="checkbox" id="on">
      <span class="track"></span>
    </label>

    <div id="fields">
      <span class="label">Watering Time</span>
      <div class="box time-row">
        <input type="time" id="time" required>
      </div>

      <span class="label">Max Water (Gal) Per Day</span>
      <div class="box stepper">
        <input type="number" id="gallons" min="0" max="10000" step="1" placeholder="X Gallons" inputmode="numeric">
        <button type="button" data-target="gallons" data-step="-5" aria-label="Decrease gallons">-</button>
        <button type="button" data-target="gallons" data-step="5" aria-label="Increase gallons">+</button>
      </div>

      <span class="label">Max Duration (Min) Per Day</span>
      <div class="box stepper">
        <input type="number" id="minutes" min="0" max="10000" step="1" placeholder="X min" inputmode="numeric">
        <button type="button" data-target="minutes" data-step="-1" aria-label="Decrease minutes">-</button>
        <button type="button" data-target="minutes" data-step="1" aria-label="Increase minutes">+</button>
      </div>
    </div>

    <button type="button" class="linkbtn" id="copy-all">Copy this day's settings to every day</button>
    <p class="hint">Times follow your saved location's timezone, or this device's if none is saved.
      <a href="{{ url_for('location', user_id=dashboard.id) }}">Set location</a></p>

    <div id="hidden"></div>
    <button type="submit" class="save">Save Settings</button>
  </form>

  <div class="foot">
    <a href="{{ url_for('dashboard', user_id=dashboard.id) }}">Back to dashboard</a>
  </div>
</main>

<script>
  const NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const SHORT = ["M","T","W","Th","F","S","Su"];

  // every weekday keeps its own on/off switch, start time and limits
  const state = {};
  {{ days | tojson }}.forEach(d => {
    state[d.name] = { on: d.on, time: d.time, gallons: d.gallons, minutes: d.minutes };
  });

  const onBox = document.getElementById("on");
  const timeIn = document.getElementById("time");
  const gal = document.getElementById("gallons");
  const min = document.getElementById("minutes");
  const bar = document.getElementById("days");
  const fields = document.getElementById("fields");

  // start on today's weekday (JS: Sunday = 0)
  let current = NAMES[(new Date().getDay() + 6) % 7];

  function num(v) { const n = parseInt(v, 10); return isNaN(n) ? 0 : Math.max(0, Math.min(n, 10000)); }

  // copy what is on screen into the selected day
  function store() {
    state[current] = {
      on: onBox.checked,
      time: timeIn.value || state[current].time,   // an emptied time box keeps the old time
      gallons: num(gal.value),
      minutes: num(min.value)
    };
  }

  // refresh the day buttons and dimming (does not touch the boxes you are typing in)
  function paint() {
    fields.classList.toggle("dim", !state[current].on);
    [...bar.children].forEach((b, i) => {
      b.classList.toggle("active", NAMES[i] === current);
      b.classList.toggle("off", !state[NAMES[i]].on);
    });
  }

  // load the selected day into the boxes
  function show() {
    const s = state[current];
    onBox.checked = s.on;
    timeIn.value = s.time;
    gal.value = s.gallons;
    min.value = s.minutes;
    paint();
  }

  NAMES.forEach((name, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "day";
    b.textContent = SHORT[i];
    b.title = name;
    b.onclick = () => { store(); current = name; show(); };
    bar.appendChild(b);
  });

  [onBox, timeIn, gal, min].forEach(el => {
    el.addEventListener("input", () => { store(); paint(); });
    el.addEventListener("change", () => { store(); paint(); });
  });

  document.querySelectorAll(".stepper button").forEach(btn => {
    btn.onclick = () => {
      const el = document.getElementById(btn.dataset.target);
      el.value = num(num(el.value) + parseInt(btn.dataset.step, 10));
      store(); paint();
    };
  });

  const copyBtn = document.getElementById("copy-all");
  copyBtn.onclick = () => {
    store();
    const s = { ...state[current] };
    NAMES.forEach(n => { state[n] = { ...s }; });
    paint();
    copyBtn.textContent = "Copied to every day";
    setTimeout(() => { copyBtn.textContent = "Copy this day's settings to every day"; }, 2000);
  };

  document.getElementById("form").addEventListener("submit", () => {
    store();
    const box = document.getElementById("hidden");
    box.innerHTML = "";
    const add = (n, v) => {
      const i = document.createElement("input");
      i.type = "hidden"; i.name = n; i.value = v; box.appendChild(i);
    };
    NAMES.forEach(name => {
      const s = state[name];
      add(name + "_time", s.time);
      add(name + "_gallons", s.gallons);
      add(name + "_minutes", s.minutes);
      if (s.on) add(name + "_enabled", "on");
    });
  });

  show();
</script>

</body>
</html>

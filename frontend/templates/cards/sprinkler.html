<div class="sprinkler" data-on="false" data-auto="false" data-sched='{{ sched_data | tojson }}'>
  <div class="sprinkler-title">Sprinkler Status: <span class="sprinkler-state">Manual - OFF</span></div>

  <button type="button" class="sprinkler-power" aria-pressed="false" aria-label="Turn sprinkler on">
    <svg viewBox="0 0 100 100" aria-hidden="true" fill="currentColor">
      <circle cx="50" cy="12" r="5"/><circle cx="50" cy="30" r="5"/><circle cx="50" cy="48" r="5"/>
      <circle cx="34" cy="40" r="5"/><circle cx="66" cy="40" r="5"/>
      <circle cx="20" cy="28" r="5"/><circle cx="80" cy="28" r="5"/>
      <rect x="28" y="64" width="44" height="10" rx="5"/>
      <rect x="45" y="64" width="10" height="28" rx="5"/>
    </svg>
  </button>

  <div class="sprinkler-auto">
    <span>Auto</span>
    <button type="button" class="sprinkler-auto-switch" role="switch" aria-checked="false" aria-label="Auto mode"></button>
  </div>
</div>

<style>
  .sprinkler { position: absolute; inset: 0; box-sizing: border-box;
               container-type: inline-size; padding: 6% 7%; overflow: hidden;
               background: linear-gradient(180deg, #a5b4fc 0%, #bbf7b0 100%);
               font-family: "Zilla Slab", "Roboto Slab", Georgia, serif; color: #000; }
  .sprinkler-title { font-size: clamp(16px, 8cqw, 44px); max-width: 62%; }

  .sprinkler-power { position: absolute; right: 7%; top: 50%; transform: translateY(-62%);
                     width: 22%; aspect-ratio: 1 / 1; border-radius: 50%;
                     border: 1px solid #000; cursor: pointer; padding: 0;
                     display: grid; place-items: center;
                     background: #8e9bb0; color: #000; transition: background .25s; }
  .sprinkler-power svg { width: 58%; height: 58%; }
  .sprinkler[data-on="true"] .sprinkler-power { background: #a3e4a0; color: #0b3d0b; }

  .sprinkler-auto { position: absolute; right: 4%; bottom: 5%;
                    display: flex; align-items: center; gap: 6px;
                    font-size: clamp(14px, 6.5cqw, 34px); }
  .sprinkler-auto-switch { width: 2.1em; height: 1.15em; border-radius: 1em; border: none;
                           background: #000; position: relative; cursor: pointer; padding: 0; }
  .sprinkler-auto-switch::after { content: ""; position: absolute; top: .13em; left: .13em;
                                  width: .89em; height: .89em; border-radius: 50%;
                                  background: #fff; transition: left .2s; }
  .sprinkler[data-auto="true"] .sprinkler-auto-switch::after { left: 1.08em; }
</style>

<script>
  if (!window.sprinklerReady) {
    window.sprinklerReady = true;

    const SPR_DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
    const SPR_RUN_MS = 60 * 60 * 1000;   // watering window: 1 hour after the scheduled time

    function sprSafeTz(tz) {
      if (!tz) return undefined;
      try { new Intl.DateTimeFormat("en-US", { timeZone: tz }); return tz; } catch (e) { return undefined; }
    }

    // one storage key per user and per card (the dashboard can hold more than one)
    function sprKey(card) {
      const all = Array.from(document.querySelectorAll(".sprinkler"));
      return "sprinkler:" + (document.body.dataset.userId || "0") + ":" + all.indexOf(card);
    }

    function sprSave(card) {
      try {
        localStorage.setItem(sprKey(card), JSON.stringify({
          auto: card.dataset.auto === "true",
          on: card.dataset.on === "true",
          stopAt: card.dataset.stopAt || null,
          lastRun: card.dataset.lastRun || null
        }));
      } catch (e) {}
    }

    // builds "Manual - OFF", "Auto - ON", etc.
    function sprRenderLabel(card) {
      const mode = card.dataset.auto === "true" ? "Auto" : "Manual";
      const state = card.dataset.on === "true" ? "ON" : "OFF";
      card.querySelector(".sprinkler-state").textContent = mode + " - " + state;
    }

    function sprSetOn(card, on) {
      const power = card.querySelector(".sprinkler-power");
      card.dataset.on = on;
      power.setAttribute("aria-pressed", on);
      power.setAttribute("aria-label", on ? "Turn sprinkler off" : "Turn sprinkler on");
      sprRenderLabel(card);
      sprSave(card);
    }

    function sprSetAuto(card, on) {
      card.dataset.auto = on;
      card.querySelector(".sprinkler-auto-switch").setAttribute("aria-checked", on);
      sprRenderLabel(card);
      sprSave(card);
    }

    // restore saved state after a refresh
    function sprRestore() {
      document.querySelectorAll(".sprinkler").forEach(card => {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(sprKey(card)) || "null"); } catch (e) {}
        if (!saved) return;

        if (saved.lastRun) card.dataset.lastRun = saved.lastRun;
        sprSetAuto(card, !!saved.auto);

        if (saved.on) {
          if (saved.stopAt && Date.now() >= Number(saved.stopAt)) {
            sprSetOn(card, false);                  // the hour ended while the page was closed
          } else {
            if (saved.stopAt) card.dataset.stopAt = saved.stopAt;
            sprSetOn(card, true);                   // run is still in progress
          }
        }
      });
    }

    function sprTick() {
      const nowMs = Date.now();

      document.querySelectorAll(".sprinkler").forEach(card => {

        // 1) Force stop: one hour after the scheduled time, no matter what
        if (card.dataset.stopAt && nowMs >= Number(card.dataset.stopAt)) {
          delete card.dataset.stopAt;
          sprSetOn(card, false);
        }

        // 2) Auto start: only when Auto is enabled
        if (card.dataset.auto !== "true") return;

        let data = null;
        try { data = JSON.parse(card.dataset.sched || "null"); } catch (e) {}
        if (!data || !data.days) return;

        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: sprSafeTz(data.timezone), weekday: "long",
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "numeric", minute: "numeric", second: "numeric", hour12: false
        }).formatToParts(new Date());
        const get = t => parts.find(p => p.type === t).value;

        const d = data.days[SPR_DAYS.indexOf(get("weekday"))];
        if (!d || !d.on || !d.time) return;

        const [hh, mm] = d.time.split(":").map(Number);
        if (isNaN(hh) || isNaN(mm)) return;

        if (parseInt(get("hour"), 10) % 24 !== hh || parseInt(get("minute"), 10) !== mm) return;

        // fire once per scheduled run, so a manual "off" during that minute sticks
        const runKey = get("year") + "-" + get("month") + "-" + get("day") + " " + d.time;
        if (card.dataset.lastRun === runKey) return;
        card.dataset.lastRun = runKey;

        // stop time = scheduled time + 1 hour
        const secIntoMinute = parseInt(get("second"), 10);
        card.dataset.stopAt = nowMs - secIntoMinute * 1000 + SPR_RUN_MS;

        sprSetOn(card, true);   // also saves lastRun and stopAt
      });
    }

    document.addEventListener("click", e => {
      const card = e.target.closest(".sprinkler");
      if (!card) return;

      if (e.target.closest(".sprinkler-power")) {
        sprSetOn(card, card.dataset.on !== "true");           // manual on/off, any time
      }
      if (e.target.closest(".sprinkler-auto-switch")) {
        sprSetAuto(card, card.dataset.auto !== "true");
      }
    });

    function sprStart() {
      sprRestore();
      sprTick();
      setInterval(sprTick, 1000);
    }
    // wait for the whole dashboard so every sprinkler card exists before restoring
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", sprStart);
    else sprStart();
  }
</script>

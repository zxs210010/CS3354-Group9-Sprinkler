<div class="daytime" data-sched='{{ sched_data | tojson }}'>
  <div class="daytime-day">--</div>
  <div class="daytime-time">--:--</div>

  <div class="daytime-next">
    <span class="daytime-next-label">Next watering</span>
    <strong class="daytime-next-text">Nothing scheduled</strong>
  </div>

  <a class="daytime-edit" href="{{ url_for('schedule', user_id=dashboard.id) }}">Edit</a>
</div>

<style>
  .daytime { position: absolute; inset: 0; box-sizing: border-box;
             container-type: inline-size; padding: 6% 7%; overflow: hidden;
             background: linear-gradient(180deg, #a5b4fc 0%, #bbf7b0 100%);
             font-family: "Zilla Slab", "Roboto Slab", Georgia, serif; color: #000;
             display: flex; flex-direction: column; justify-content: center; gap: 2%; }
  .daytime-day  { font-size: clamp(16px, 8cqw, 44px); }
  .daytime-time { font-size: clamp(24px, 14cqw, 72px); line-height: 1; }
  .daytime-next { margin-top: 4%; font-size: clamp(13px, 5.5cqw, 30px); }
  .daytime-next-label { display: block; opacity: .7; }
  .daytime-edit { position: absolute; right: 5%; bottom: 5%; background: #000; color: #fff;
                  text-decoration: none; border-radius: 8px; padding: .4em 1em;
                  font-size: clamp(13px, 5cqw, 26px); }
  .daytime-edit:hover { background: #333; }
</style>

<script>
  (function () {
    if (window.daytimeReady) return;
    window.daytimeReady = true;

    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    // a usable timezone name, or undefined (= this device's own timezone)
    function safeTz(tz) {
      if (!tz) return undefined;
      try { new Intl.DateTimeFormat("en-US", { timeZone: tz }); return tz; } catch (e) { return undefined; }
    }

    function fmt(hh, mm) {
      return (hh % 12 || 12) + ":" + String(mm).padStart(2, "0") + " " + (hh < 12 ? "AM" : "PM");
    }

    // data = { timezone, days: [ {on, time: "HH:MM"} x 7, Monday first ] }
    function nextLabel(data, tz) {
      if (!data || !data.days) return null;
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: tz, weekday: "long", hour: "numeric", minute: "numeric", hour12: false
      }).formatToParts(new Date());
      const get = type => parts.find(p => p.type === type).value;
      const today = DAYS.indexOf(get("weekday"));
      const nowMin = (parseInt(get("hour"), 10) % 24) * 60 + parseInt(get("minute"), 10);

      for (let offset = 0; offset < 8; offset++) {
        const weekday = (today + offset) % 7;
        const d = data.days[weekday];
        if (!d || !d.on || !d.time) continue;                    // sprinkler is off that day
        const [hh, mm] = d.time.split(":").map(Number);
        if (isNaN(hh) || isNaN(mm)) continue;
        if (offset === 0 && hh * 60 + mm <= nowMin) continue;    // today's run already passed
        const when = offset === 0 ? "Today" : offset === 1 ? "Tomorrow" : DAYS[weekday];
        return when + " at " + fmt(hh, mm);
      }
      return null;
    }

    function tick() {
      const now = new Date();
      document.querySelectorAll(".daytime").forEach(card => {
        let data = null;
        try { data = JSON.parse(card.dataset.sched || "null"); } catch (e) {}
        const tz = safeTz(data && data.timezone);   // the location's timezone, else this device's
        card.querySelector(".daytime-day").textContent =
          now.toLocaleDateString([], { weekday: "long", timeZone: tz });
        card.querySelector(".daytime-time").textContent =
          now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit", timeZone: tz });
        card.querySelector(".daytime-next-text").textContent =
          nextLabel(data, tz) || "Nothing scheduled";
      });
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>

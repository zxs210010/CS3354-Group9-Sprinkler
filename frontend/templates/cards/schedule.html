<div class="nextrun" data-sched='{{ sched_data | tojson }}'>
  <div class="nextrun-title">Watering Schedule</div>
  <div class="nextrun-list"></div>
  <a class="nextrun-full" href="{{ url_for('schedule', user_id=dashboard.id) }}">Edit schedule</a>
</div>

<style>
  .nextrun { position: absolute; inset: 0; box-sizing: border-box;
             container-type: inline-size; padding: 6% 7%; overflow: hidden;
             background: linear-gradient(180deg, #a5b4fc 0%, #bbf7b0 100%);
             font-family: "Zilla Slab", "Roboto Slab", Georgia, serif; color: #000;
             display: flex; flex-direction: column; gap: 3%; }
  .nextrun-title { font-size: clamp(16px, 8cqw, 44px); }

  .nextrun-list { flex: 1; min-height: 0; overflow: hidden; display: grid; align-content: start;
                  gap: .3em .8em; font-size: clamp(12px, 5.2cqw, 28px); }
  .nextrun-list.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .nextrun-item { display: flex; justify-content: space-between; gap: .6em; padding: .2em .6em;
                  background: rgba(255,255,255,.55); border-radius: 6px; white-space: nowrap; }
  .nextrun-item span:first-child { font-weight: 700; }
  .nextrun-empty { opacity: .7; }

  .nextrun-full { align-self: flex-end; color: #000; font-size: clamp(11px, 4cqw, 20px); }
</style>

<script>
  if (!window.nextrunReady) {
    window.nextrunReady = true;
    const NEXTRUN_DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

    function nextrunFmt(t) {
      const [h, m] = String(t).split(":").map(Number);
      if (isNaN(h) || isNaN(m)) return t;
      return (h % 12 || 12) + ":" + String(m).padStart(2, "0") + " " + (h < 12 ? "AM" : "PM");
    }

    // fills in every card that has not been drawn yet (also catches cards added later)
    function nextrunRender() {
      document.querySelectorAll(".nextrun:not([data-ready])").forEach(card => {
        let data = null;
        try { data = JSON.parse(card.dataset.sched || "null"); } catch (e) {}

        const list = card.querySelector(".nextrun-list");
        list.textContent = "";

        // only the days the sprinkler will run, in week order
        const active = ((data && data.days) || [])
          .map((d, i) => ({ d, i }))
          .filter(x => x.d && x.d.on && x.d.time);

        if (!active.length) {
          const empty = document.createElement("div");
          empty.className = "nextrun-empty";
          empty.textContent = "No watering days scheduled";
          list.appendChild(empty);
        }

        active.forEach(({ d, i }) => {
          const row = document.createElement("div");
          row.className = "nextrun-item";
          const day = document.createElement("span");
          day.textContent = NEXTRUN_DAYS[i];
          const time = document.createElement("span");
          time.textContent = nextrunFmt(d.time);
          row.append(day, time);
          list.appendChild(row);
        });

        list.classList.toggle("two", active.length > 4);
        card.dataset.ready = "1";
      });
    }
    nextrunRender();
    setInterval(nextrunRender, 1000);
  }
</script>

<div class="daytime" data-on="false" data-auto="false">
  <div class="daytime-title">Sprinkler Status: <span class="sprinkler-state">OFF</span></div>

  <button type="button" class="sprinkler-power" aria-pressed="false" aria-label="Turn sprinkler on">
    <svg viewBox="0 0 100 100" aria-hidden="true" fill="currentColor">
      <circle cx="50" cy="12" r="5"/><circle cx="50" cy="30" r="5"/><circle cx="50" cy="48" r="5"/>
      <circle cx="34" cy="40" r="5"/><circle cx="66" cy="40" r="5"/>
      <circle cx="20" cy="28" r="5"/><circle cx="80" cy="28" r="5"/>
      <rect x="28" y="64" width="44" height="10" rx="5"/>
      <rect x="45" y="64" width="10" height="28" rx="5"/>
    </svg>
  </button>

  <div class="sprinkler-auto">
    <span>Auto</span>
    <button type="button" class="sprinkler-auto-switch" role="switch" aria-checked="false" aria-label="Auto mode"></button>
  </div>
</div>

<style>
  .sprinkler { position: absolute; inset: 0; box-sizing: border-box;
               container-type: inline-size; padding: 6% 7%; overflow: hidden;
               background: linear-gradient(180deg, #a5b4fc 0%, #bbf7b0 100%);
               font-family: "Zilla Slab", "Roboto Slab", Georgia, serif; color: #000; }
  .sprinkler-title { font-size: clamp(16px, 8cqw, 44px); max-width: 62%; }

  .sprinkler-power { position: absolute; right: 7%; top: 50%; transform: translateY(-62%);
                     width: 22%; aspect-ratio: 1 / 1; border-radius: 50%;
                     border: 1px solid #000; cursor: pointer; padding: 0;
                     display: grid; place-items: center;
                     background: #8e9bb0; color: #000; transition: background .25s; }
  .sprinkler-power svg { width: 58%; height: 58%; }
  .sprinkler[data-on="true"] .sprinkler-power { background: #a3e4a0; color: #0b3d0b; }

  .sprinkler-auto { position: absolute; right: 4%; bottom: 5%;
                    display: flex; align-items: center; gap: 6px;
                    font-size: clamp(14px, 6.5cqw, 34px); }
  .sprinkler-auto-switch { width: 2.1em; height: 1.15em; border-radius: 1em; border: none;
                           background: #000; position: relative; cursor: pointer; padding: 0; }
  .sprinkler-auto-switch::after { content: ""; position: absolute; top: .13em; left: .13em;
                                  width: .89em; height: .89em; border-radius: 50%;
                                  background: #fff; transition: left .2s; }
  .sprinkler[data-auto="true"] .sprinkler-auto-switch::after { left: 1.08em; }
</style>

<script>
  if (!window.sprinklerReady) {
    window.sprinklerReady = true;
    document.addEventListener("click", e => {
      const card = e.target.closest(".sprinkler");
      if (!card) return;

      const power = e.target.closest(".sprinkler-power");
      const auto = e.target.closest(".sprinkler-auto-switch");

      if (power) {
        const on = card.dataset.on !== "true";
        card.dataset.on = on;
        power.setAttribute("aria-pressed", on);
        power.setAttribute("aria-label", on ? "Turn sprinkler off" : "Turn sprinkler on");
        card.querySelector(".sprinkler-state").textContent = on ? "ON" : "OFF";
      }
      if (auto) {
        const on = card.dataset.auto !== "true";
        card.dataset.auto = on;
        auto.setAttribute("aria-checked", on);
      }
    });
  }
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
    /* ---- Background + Logo ---- */
    :root { --c1: #c5d4fb; --c2: #177858;
            --bg: linear-gradient(135deg, var(--c1), var(--c2)); }
    body { margin: 0; background: #ba5555; display: flex; justify-content: center;
           height: 100vh; height: 100dvh; overflow: hidden; font-family: system-ui, sans-serif; }
    .screen { width: 100%; height: 100%; padding: 2vh 30px; box-sizing: border-box;
              display: flex; flex-direction: column; background: var(--bg); }
    .logo { display: block; height: 12vh; width: auto; margin: 0 auto; flex: none; }
</style>
</head>
<body>
    <div class="screen">
        <img class="logo" src="{{ url_for('static', filename='aquathinklogo.png') }}" alt="Aqua think">
    </div>
</body>
</html>
